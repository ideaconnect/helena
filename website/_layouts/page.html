---
layout: default
---
<section class="page-hero" style="padding-bottom:0">
  <div class="wrap">
    <div class="page-hero-grid{% unless page.hero_image %} no-art{% endunless %}">
      <div class="page-hero-copy">
        {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
      </div>
      {% if page.hero_image %}
      <div class="page-hero-art">
        <span class="glow" aria-hidden="true"></span>
        <picture>
          <source srcset="{{ page.hero_image | replace: '.png', '.webp' | relative_url }}" type="image/webp">
          <img src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_alt | default: page.title }}" width="{{ page.hero_w | default: 1600 }}" height="{{ page.hero_h | default: 1116 }}" fetchpriority="high" decoding="async">
        </picture>
      </div>
      {% endif %}
    </div>
  </div>
</section>
<section>
  <div class="wrap prose">
    {{ content }}
  </div>
</section>
