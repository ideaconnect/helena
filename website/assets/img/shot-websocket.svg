<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Helena WebSocket session dialog with a message transcript">
  <defs><style>.t{font-family:'Segoe UI',Inter,system-ui,sans-serif}.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}</style></defs>
  <rect width="900" height="460" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="459" rx="16" fill="none" stroke="#243044"/>
  <rect x="0" y="0" width="900" height="46" rx="16" fill="#131a24"/>
  <rect x="0" y="30" width="900" height="16" fill="#131a24"/>
  <text x="24" y="29" class="t" font-size="14" fill="#e6edf3" font-weight="700">WebSocket</text>
  <text x="116" y="29" class="mono" font-size="13" fill="#9aa7b8">wss://stream.acme.dev/feed</text>
  <text x="868" y="29" class="t" font-size="16" fill="#9aa7b8">✕</text>

  <!-- transcript -->
  <rect x="20" y="62" width="860" height="320" rx="10" fill="#080b10" stroke="#243044"/>
  <g class="mono" font-size="13">
    <text x="38" y="92" fill="#22c55e">✓ connected</text>
    <text x="38" y="124" fill="#7ee2a8">→ {"action":"subscribe","topic":"prices"}</text>
    <text x="38" y="156" fill="#cbd5e1">← {"topic":"prices","sym":"ACME","px":41.20}</text>
    <text x="38" y="188" fill="#cbd5e1">← {"topic":"prices","sym":"ACME","px":41.27}</text>
    <text x="38" y="220" fill="#7ee2a8">→ {"action":"ping"}</text>
    <text x="38" y="252" fill="#cbd5e1">← {"pong":true}</text>
    <text x="38" y="284" fill="#cbd5e1">← {"topic":"prices","sym":"ACME","px":41.31}</text>
    <text x="38" y="316" fill="#cbd5e1">← {"topic":"prices","sym":"ACME","px":41.29}</text>
    <text x="38" y="352" fill="#6b7a8d">↑ pings answered automatically · fragments reassembled</text>
  </g>

  <!-- input row -->
  <rect x="20" y="398" width="740" height="38" rx="9" fill="#161d29" stroke="#243044"/>
  <text x="38" y="422" class="mono" font-size="13" fill="#9aa7b8">{"action":"subscribe","topic":"trades"}</text>
  <rect x="772" y="398" width="108" height="38" rx="9" fill="#22c55e"/>
  <text x="826" y="422" text-anchor="middle" class="t" font-size="14" fill="#04210f" font-weight="700">Send</text>
</svg>
