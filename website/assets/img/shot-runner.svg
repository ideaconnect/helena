<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A helena run headless collection run in a terminal">
  <defs><style>.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}</style></defs>
  <rect width="900" height="420" rx="14" fill="#080b10"/>
  <rect x="0.5" y="0.5" width="899" height="419" rx="14" fill="none" stroke="#243044"/>
  <rect x="0" y="0" width="900" height="40" rx="14" fill="#131a24"/>
  <rect x="0" y="26" width="900" height="14" fill="#131a24"/>
  <circle cx="22" cy="20" r="5.5" fill="#ff5f57"/><circle cx="40" cy="20" r="5.5" fill="#febc2e"/><circle cx="58" cy="20" r="5.5" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" class="mono" font-size="12" fill="#9aa7b8">zsh — helena run</text>
  <g class="mono" font-size="14">
    <text x="22" y="76" fill="#22c55e">$</text><text x="40" y="76" fill="#e6edf3">helena run ./collections/acme --env Staging</text>
    <text x="22" y="108" fill="#9aa7b8">Running 5 requests in "Acme API" (env: Staging)</text>

    <text x="22" y="142" fill="#22c55e">ok  </text><text x="70" y="142" fill="#e6edf3">Auth/Login            POST  200  121ms</text>
    <text x="62" y="166" fill="#22c55e">PASS  token present</text>

    <text x="22" y="198" fill="#22c55e">ok  </text><text x="70" y="198" fill="#e6edf3">Profile/Get           GET   200   84ms</text>
    <text x="62" y="222" fill="#22c55e">PASS  status is 200</text>
    <text x="62" y="244" fill="#22c55e">PASS  res.json.plan equals "pro"</text>

    <text x="22" y="278" fill="#fbbf24">SKIP</text><text x="70" y="278" fill="#e6edf3">Profile/Avatar        GET    —     —  </text>
    <text x="62" y="300" fill="#9aa7b8">skipped by pre-script (helena.runner.skip)</text>

    <text x="22" y="334" fill="#22c55e">ok  </text><text x="70" y="334" fill="#e6edf3">Orders/List           GET   200  102ms</text>

    <text x="22" y="376" fill="#e6edf3">5 requests · 4 checks passed · 0 failed · 1 skipped</text>
    <text x="22" y="400" fill="#22c55e">✓ all checks passed</text>
  </g>
</svg>
