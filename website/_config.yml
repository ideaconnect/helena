# Jekyll configuration for the Helena project website (#64).
# Self-contained: custom layouts + CSS, no gem theme, no plugins. Built and
# deployed to a Cloudflare Worker by .github/workflows/website.yml; see
# website/README.md for deployment.

title: Helena
tagline: A native, lightweight API client
description: >-
  Helena is a fast, native API client for Linux, macOS, and Windows - a
  lightweight take on the usual desktop API clients, built with Go and Fyne. One
  small binary, plain-text collections, nine auth schemes, scripting, SSE, and
  WebSocket.
author: Bartosz Pachołek
# Copyright line + author/company link rendered in the footer and About page.
copyright: "IDCT · Bartosz Pachołek"
author_url: "https://idct.tech"

# Served at https://idct.tech/helena/ by a Cloudflare Worker routed on the
# /helena path (wrangler.jsonc), so url is the apex and baseurl is the path.
# Internal links use relative_url/absolute_url, so baseurl must stay in sync
# with the Worker's routes.
url: "https://idct.tech"
baseurl: "/helena"

repo: "https://github.com/ideaconnect/helena"
releases: "https://github.com/ideaconnect/helena/releases"
# Live Microsoft Store listing (Store ID 9NWPKK6CTDR1). Canonical URL with no
# region/share query params, so the link isn't pinned to a locale or campaign.
msstore: "https://apps.microsoft.com/detail/9NWPKK6CTDR1"
discord: "https://discord.gg/uYsuaa8HNm"
sponsor: "https://github.com/sponsors/ideaconnect"
coffee: "https://buymeacoffee.com/idct"

# Pretty URLs: each page builds to <name>/index.html so the nav's "/features/",
# "/contact/", … links resolve as directory indexes.
permalink: pretty

# Built with custom layouts under _layouts/; no remote theme.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - tools
  - wrangler.jsonc

# Nav order is defined here and rendered by _layouts/default.html.
nav:
  - { title: "Features", url: "/features/" }
  - { title: "Roadmap", url: "/roadmap/" }
  - { title: "Examples", url: "/examples/" }
  - { title: "About", url: "/about/" }
  - { title: "Contact", url: "/contact/" }
