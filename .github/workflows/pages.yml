name: Pages

# Build and deploy the public site to GitHub Pages at the custom domain
# helena.idct.tech (see website/CNAME). One Pages deployment serves BOTH:
#   /       → the Jekyll marketing site (website/)
#   /docs/  → the MkDocs Material reference docs (docs/, mkdocs.yml)
# A repo has a single Pages site, so this is the only workflow that owns it.
#
# One-time setup: Settings → Pages → Source: GitHub Actions, then point DNS
# (CNAME helena.idct.tech → ideaconnect.github.io) and confirm the custom domain
# under Settings → Pages. Until DNS is live the site is reachable only once the
# domain resolves — the deploy itself still succeeds.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - mkdocs.yml
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- Marketing site (Jekyll) → site root ---
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: website
      - name: Build website (Jekyll)
        working-directory: website
        run: bundle exec jekyll build --baseurl "" --destination "$GITHUB_WORKSPACE/_site"

      # --- Reference docs (MkDocs) → /docs/ ---
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build docs (MkDocs)
        run: |
          pip install mkdocs-material
          mkdocs build --site-dir "$GITHUB_WORKSPACE/_site/docs"

      # website/CNAME is copied to _site/CNAME by Jekyll; assert it so a rename
      # can't silently drop the custom domain.
      - name: Verify custom domain
        run: test -f _site/CNAME && grep -qx "helena.idct.tech" _site/CNAME

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
