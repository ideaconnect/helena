name: Website

# Build the public site and deploy it to a Cloudflare Worker (static assets),
# served at https://idct.tech/helena/. One deployment serves BOTH:
#   /helena/      → the Jekyll marketing site (website/)
#   /helena/docs/ → the MkDocs Material reference docs (docs/, mkdocs.yml)
#
# The Worker's config, routes included, is website/wrangler.jsonc. Its routes
# claim idct.tech/helena and idct.tech/helena/* on the Cloudflare-proxied
# idct.tech zone; the rest of the domain is untouched. The Worker matches the
# full request path against its assets, so the build nests under
# website/_dist/helena/.
#
# Repo secrets: CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_AUTHENTICATION_TOKEN — an
# API token with Account › Workers Scripts: Edit and Zone › Workers Routes: Edit
# on idct.tech.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - mkdocs.yml
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - mkdocs.yml
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- Marketing site (Jekyll) → /helena/ ---
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: website
      - name: Build website (Jekyll)
        working-directory: website
        # JEKYLL_ENV=production gates the Google Analytics include (_includes/
        # analytics.html) so gtag is emitted only on the deployed site, never in
        # local `make website` (development) builds.
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "/helena" --destination _dist/helena

      # --- Reference docs (MkDocs) → /helena/docs/ ---
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build docs (MkDocs)
        run: |
          pip install mkdocs-material
          mkdocs build --site-dir website/_dist/helena/docs

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/_dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://idct.tech/helena/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: website/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: website/_dist
      # Wrangler 4 needs Node 22+.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_AUTHENTICATION_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.137.0"
          workingDirectory: website
          command: deploy
