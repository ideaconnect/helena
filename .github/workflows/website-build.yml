name: Website build

# Build-only check for the Jekyll site under website/ — catches Liquid / YAML /
# layout errors on every change. It does NOT deploy (no Pages permissions), so
# it can't conflict with whichever workflow owns GitHub Pages. Wire up the
# deploy separately when ready (see website/README.md).

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website-build.yml
  pull_request:
    paths:
      - website/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: website
      - run: bundle install
      - name: Build site (strict)
        run: bundle exec jekyll build --baseurl "/helena"
