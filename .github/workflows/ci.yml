name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 04:00 UTC — mutation testing only.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    # Build / test runs on every push + PR, but skipped on the
    # nightly schedule (which only triggers mutation).
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: helena-linux-amd64
          - os: windows-latest
            artifact: helena-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fyne needs OpenGL / X11 headers on Linux; the windows-latest runner ships
      # with mingw-w64 GCC on PATH so cgo works out of the box there.
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Linux runs tests under -race + coverage profile so the coverage
      # gate (next step) can enforce the per-package floor. Windows
      # runs the same suite under -race but skips the coverage gate
      # (coverage numbers are platform-agnostic; gating once is enough).
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage gate (Linux)
        if: runner.os == 'Linux'
        run: go run ./cmd/covergate -profile coverage.out -exclude internal/ui,cmd,features,integration -floor 90

      - name: Upload coverage profile (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./... -race

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.artifact }} ./cmd/helena

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # -H windowsgui suppresses the console window when launched from Explorer.
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o ${{ matrix.artifact }} ./cmd/helena

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  fuzz:
    name: Fuzz ${{ matrix.target.pkg }} ${{ matrix.target.name }}
    # Fuzz short-runs on every PR so a newly-merged change can't
    # quietly regress a parsing surface. Pushes to main skip
    # because the build job already ran the seed corpora as
    # regular tests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {pkg: ./internal/vars,       name: FuzzResolveTemplate}
          - {pkg: ./internal/vars,       name: FuzzResolveAccumulatesMissingPerCallsite}
          - {pkg: ./internal/httpclient, name: FuzzBuildBody}
          - {pkg: ./internal/httpclient, name: FuzzBuildBodyForm}
          - {pkg: ./internal/storage,    name: FuzzReadCollectionFile}
          - {pkg: ./internal/storage,    name: FuzzReadRequestFile}
          - {pkg: ./internal/storage,    name: FuzzLoadCollection}
          - {pkg: ./internal/session,    name: FuzzSplitChainPath}
          - {pkg: ./internal/auth,       name: FuzzResolveValuesBasic}
          - {pkg: ./internal/auth,       name: FuzzResolveValuesOAuth2}
          - {pkg: ./internal/auth,       name: FuzzResolveValuesAPIKey}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Fuzz ${{ matrix.target.name }} for 20s
        run: go test ${{ matrix.target.pkg }} -fuzz='^${{ matrix.target.name }}$' -fuzztime=20s

  mutation:
    name: Mutation testing (nightly)
    # Mutation runs are slow (a few minutes per package). Triggered
    # only on the nightly cron and on manual dispatch — never on
    # per-PR pushes. Results upload as an artifact; the job is
    # report-only and does not gate merges.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Run mutation suite
        run: make mutation 2>&1 | tee mutation.log
        continue-on-error: true
      - name: Upload mutation log
        uses: actions/upload-artifact@v4
        with:
          name: mutation-log
          path: mutation.log
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
