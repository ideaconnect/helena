name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 04:00 UTC — mutation testing only.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref to save CI minutes — but never a
# tag run, so an in-flight release is always allowed to finish (#31).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# Lock the Go toolchain to exactly what go.mod's `toolchain` directive pins,
# so CI never silently auto-downloads a different one (#32). setup-go installs
# that version from go.mod; `local` then forbids any further switch.
env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    # Build / test runs on every push + PR, but skipped on the
    # nightly schedule (which only triggers mutation).
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: helena-linux-amd64
          - os: windows-latest
            artifact: helena-windows-amd64.exe
          - os: macos-latest
            artifact: helena-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fyne needs OpenGL / X11 headers on Linux; the windows-latest runner ships
      # with mingw-w64 GCC on PATH so cgo works out of the box there.
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Linux runs tests under -race + coverage profile so the coverage
      # gate (next step) can enforce the per-package floor. Windows
      # runs the same suite under -race but skips the coverage gate
      # (coverage numbers are platform-agnostic; gating once is enough).
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage gate (Linux)
        if: runner.os == 'Linux'
        run: go run ./cmd/covergate -profile coverage.out -exclude internal/ui,cmd,features,integration -floor 90

      - name: Upload coverage profile (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

      - name: Test (non-Linux)
        if: runner.os != 'Linux'
        # macOS + Windows run the same race suite; the coverage gate runs once
        # on Linux (coverage is platform-agnostic).
        run: go test ./... -race

      - name: Build (Linux)
        if: runner.os == 'Linux'
        # ref_name is the tag (e.g. v0.1.0) on a release build, else the branch
        # — a non-empty default so every binary can report its origin (#26).
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" -o ${{ matrix.artifact }} ./cmd/helena

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # -H windowsgui suppresses the console window when launched from Explorer.
        run: go build -trimpath -ldflags="-s -w -H windowsgui -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" -o ${{ matrix.artifact }} ./cmd/helena

      - name: Build (macOS)
        if: runner.os == 'macOS'
        # macOS runners ship the Xcode CLT, so cgo/Metal build with no extra deps.
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" -o ${{ matrix.artifact }} ./cmd/helena

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  fuzz:
    name: Fuzz ${{ matrix.target.pkg }} ${{ matrix.target.name }}
    # Fuzz short-runs on every PR so a newly-merged change can't
    # quietly regress a parsing surface. Pushes to main skip
    # because the build job already ran the seed corpora as
    # regular tests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {pkg: ./internal/vars,       name: FuzzResolveTemplate}
          - {pkg: ./internal/vars,       name: FuzzResolveAccumulatesMissingPerCallsite}
          - {pkg: ./internal/httpclient, name: FuzzBuildBody}
          - {pkg: ./internal/httpclient, name: FuzzBuildBodyForm}
          - {pkg: ./internal/storage,    name: FuzzReadCollectionFile}
          - {pkg: ./internal/storage,    name: FuzzReadRequestFile}
          - {pkg: ./internal/storage,    name: FuzzLoadCollection}
          - {pkg: ./internal/session,    name: FuzzSplitChainPath}
          - {pkg: ./internal/auth,       name: FuzzResolveValuesBasic}
          - {pkg: ./internal/auth,       name: FuzzResolveValuesOAuth2}
          - {pkg: ./internal/auth,       name: FuzzResolveValuesAPIKey}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Fuzz ${{ matrix.target.name }} for 20s
        run: go test ${{ matrix.target.pkg }} -fuzz='^${{ matrix.target.name }}$' -fuzztime=20s

  lint:
    name: golangci-lint
    # Runs on every push + PR (not the nightly mutation cron).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The ui package imports Fyne, so the linter needs the GL/X11 headers to
      # type-check it.
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
      # Build golangci-lint from source with the pinned toolchain rather than
      # downloading a prebuilt release: the v1.64.8 release binary is built with
      # go1.24 and refuses to run against this repo's go1.26 target
      # ("build Go version lower than targeted").
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

  vuln:
    name: govulncheck
    # Surfaces known-vulnerable dependencies / stdlib on every push + PR.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  mutation:
    name: Mutation testing (nightly)
    # Mutation runs are slow (a few minutes per package). Triggered
    # only on the nightly cron and on manual dispatch — never on
    # per-PR pushes. Results upload as an artifact; the job is
    # report-only and does not gate merges.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Run mutation suite
        run: make mutation 2>&1 | tee mutation.log
        continue-on-error: true
      - name: Upload mutation log
        uses: actions/upload-artifact@v4
        with:
          name: mutation-log
          path: mutation.log
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # OIDC for keyless provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@v4 # source for the SBOM scan

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Archive each native binary so releases ship a conventional, named
      # archive rather than a bare ELF/exe (#35).
      - name: Archive binaries
        run: |
          mkdir -p dist
          cp LICENSE README.md artifacts/ 2>/dev/null || true
          tar -C artifacts -czf dist/helena-linux-amd64.tar.gz helena-linux-amd64 LICENSE README.md
          tar -C artifacts -czf dist/helena-darwin-arm64.tar.gz helena-darwin-arm64 LICENSE README.md
          (cd artifacts && zip -q ../dist/helena-windows-amd64.zip helena-windows-amd64.exe LICENSE README.md)

      # Software bill of materials (SPDX) for the released module (#27).
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/helena.sbom.spdx.json

      # SHA-256 checksums over every artifact (#27/#35). Globbing happens
      # before SHA256SUMS is created, so it never checksums itself.
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      # Cryptographic, keyless (Sigstore) provenance attestation for the
      # release archives — the signing + provenance of #27/#35 without managing
      # long-lived keys.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/helena-*.tar.gz dist/helena-*.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
