openapi: 3.1.0
info:
  title: Users API
  version: 2.4.0
  description: |
    Exercises the importer's tag-folder grouping, body-example
    extraction, header / query / path parameter splitting, and
    multi-server fallback. Loaded by integration tests and the
    8.3 godog suite that import a non-trivial spec.
servers:
  - url: https://api.example.com/v2
  - url: https://staging.example.com/v2
tags:
  - name: users
    description: User management
  - name: ops
    description: Operational endpoints
paths:
  /health:
    get:
      summary: Health probe
      tags:
        - ops
      responses:
        '200':
          description: OK
  /users:
    get:
      summary: List users
      tags:
        - users
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 25
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of users
    post:
      summary: Create user
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Alice
              email: alice@example.com
      responses:
        '201':
          description: Created
  /users/{id}:
    get:
      summary: Fetch a user
      tags:
        - users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
        '404':
          description: Missing
